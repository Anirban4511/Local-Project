<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviews</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <main>
      <div class="container">
        <nav class="navbar">
          <div class="left">
            <i id="circle" class="fa-solid fa-circle"></i>
            <p style="font-size: 1.3rem">JIO 4G - Jio</p>
          </div>
          <div class="right">
            <i class="fa-solid fa-clock"></i>
            <i class="fa-solid fa-bell-slash"></i>
            <i class="fa-brands fa-bluetooth-b"></i>
            <div class="net">
              <div
                id="speed"
                style="position: relative; font-size: 6px; top: -2px"
              ></div>
              <div
                id="unit"
                style="position: relative; font-size: 6px; top: -2px"
              ></div>
            </div>
            <div class="volte">
              <div style="position: relative; font-size: 6px; top: -2px">
                Vo
              </div>
              <div style="position: relative; font-size: 5px; top: -2px">
                LTE 1
              </div>
            </div>
            <i class="fa-solid fa-wifi"></i>
            <i
              style="position: relative; top: -1px; font-size: 11px"
              class="fa-solid fa-battery-three-quarters"
            ></i>
          </div>
        </nav>
        <div
          style="
            display: flex;
            justify-content: center;
            height: 10vh;
            align-items: center;
          "
        >
          <i style="font-size: 17px" class="fa-solid fa-lock"></i>
        </div>
        <span
          style="display: flex; justify-content: center; font-size: 42px"
          id="time"
        ></span>
        <span
          style="display: flex; justify-content: center; font-size: 12px"
          id="date"
        ></span>
        <div id="box"><i class="fa-solid fa-camera"></i></div>
        <div class="bottom">
          <div class="swipe">Swipe up to unlock</div>
          <p class="icon">^</p>
        </div>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
